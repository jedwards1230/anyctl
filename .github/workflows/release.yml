# Release anyctl on push to main. Version bump rule for the merged PR:
#   1. An explicit semver:major|minor|patch label wins; semver:none always skips
#      (even alongside a bump label).
#   2. No label: patch UNLESS every changed file is dev-only (CI, docs for
#      contributors, tests, linter config, view build sources -- see
#      .github/.releaseignore, gitignore syntax), in which case no release is cut.
#   3. No associated PR (direct push), or no label and the file list can't be
#      fetched/classified: release as patch with a ::warning:: (a missed release
#      is invisible; an extra one is harmless). semver:none is still honored.
# workflow_dispatch always releases. The detect job decides; the shared
# ai-release.yml computes the version/tag and AI release notes
# (create_release: false), then build/image/chart publish from the tagged ref and
# the release job publishes the GitHub Release with the binaries + AI body.
# Every publish job is gated on detect.outputs.release == 'true'.
name: Release

run-name: >-
  ${{
    github.event_name == 'workflow_dispatch'
      && format('Release: {0}{1}', inputs.dry_run && 'dry-run ' || '', inputs.bump_type)
      || format('Release: {0}', github.event.head_commit.message || github.sha)
  }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump type"
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch
      dry_run:
        description: "Compute version + preview notes without tagging or publishing"
        required: false
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  detect:
    name: Detect bump type
    runs-on: ubuntu-latest
    outputs:
      bump_type: ${{ steps.bump.outputs.type }}
      release: ${{ steps.bump.outputs.release }}
      dry_run: ${{ steps.bump.outputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/.releaseignore
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Determine bump type
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            {
              echo "type=${{ inputs.bump_type }}"
              echo "release=true"
              echo "dry_run=${{ inputs.dry_run }}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "dry_run=false" >> "$GITHUB_OUTPUT"

          # Find the merged PR for this commit (number + labels), with retries.
          PR_JSON=""
          for attempt in 1 2 3; do
            PR_JSON=$(gh api "repos/${GH_REPO}/commits/${GITHUB_SHA}/pulls" 2>/dev/null \
              | jq -c --arg sha "$GITHUB_SHA" \
                  '[.[] | select(.merge_commit_sha == $sha)] | first // empty' 2>/dev/null || true)
            [ -n "$PR_JSON" ] && break
            echo "Attempt ${attempt}: no PR for ${GITHUB_SHA}, retrying in 5s..."
            sleep 5
          done

          if [ -z "$PR_JSON" ]; then
            echo "::warning::No merged PR found for ${GITHUB_SHA} (direct push?) — cannot classify files, releasing as patch."
            { echo "type=patch"; echo "release=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          N=$(jq -r '.number' <<<"$PR_JSON")
          LABELS=$(jq -r '.labels[].name' <<<"$PR_JSON")
          echo "PR #${N} labels: ${LABELS:-<none>}"

          # Fetch the PR's changed files (plus previous_filename, so a rename OUT
          # of a product path counts as product). Empty on API failure.
          FILES=""
          FILES_OK=true
          if ! FILES=$(gh api "repos/${GH_REPO}/pulls/${N}/files" --paginate \
                --jq '.[] | .filename, (.previous_filename // empty)') || [ -z "$FILES" ]; then
            FILES_OK=false
          fi

          # Classify with git's own ignore engine against .github/.releaseignore
          # (gitignore syntax; the single source of truth for what is dev-only).
          # A missing/empty file means nothing is dev-only. Run in a throwaway
          # repo so the checkout's own .gitignore can't leak in.
          ALL_DEV=false
          FIRST_PRODUCT=""
          CLASSIFY_ERR=false
          RELEASEIGNORE="${GITHUB_WORKSPACE}/.github/.releaseignore"
          if [ "$FILES_OK" = true ]; then
            mapfile -t FILE_LIST < <(grep . <<<"$FILES" | sort -u)
            if ! grep -qv -e '^[[:space:]]*#' -e '^[[:space:]]*$' "$RELEASEIGNORE" 2>/dev/null; then
              echo "::notice::.github/.releaseignore is missing or empty — nothing is dev-only."
              FIRST_PRODUCT=${FILE_LIST[0]}
            else
              rc=0
              if SCRATCH=$(mktemp -d) && git init -q "$SCRATCH" \
                  && printf '%s\0' "${FILE_LIST[@]}" > "$SCRATCH.paths"; then
                git -C "$SCRATCH" -c core.excludesFile="$RELEASEIGNORE" \
                  check-ignore --no-index -z --stdin < "$SCRATCH.paths" > "$SCRATCH.matched" || rc=$?
              else
                rc=2
              fi
              if [ "$rc" -gt 1 ]; then
                CLASSIFY_ERR=true
                FILES_OK=false
              else
                mapfile -d '' MATCHED < "$SCRATCH.matched"
                if [ "${#MATCHED[@]}" -eq "${#FILE_LIST[@]}" ]; then
                  ALL_DEV=true
                else
                  declare -A IS_DEV=()
                  for m in "${MATCHED[@]}"; do IS_DEV["$m"]=1; done
                  for f in "${FILE_LIST[@]}"; do
                    if [ -z "${IS_DEV[$f]:-}" ]; then FIRST_PRODUCT=$f; break; fi
                  done
                fi
              fi
              rm -rf "$SCRATCH" "$SCRATCH.paths" "$SCRATCH.matched"
            fi
          fi

          # 1. Explicit label always wins; semver:none beats any bump label (an explicit
          #    opt-out is always honored).
          LABEL_BUMP=""
          if grep -qx 'semver:none' <<<"$LABELS"; then LABEL_BUMP="none"
          elif grep -qx 'semver:major' <<<"$LABELS"; then LABEL_BUMP="major"
          elif grep -qx 'semver:minor' <<<"$LABELS"; then LABEL_BUMP="minor"
          elif grep -qx 'semver:patch' <<<"$LABELS"; then LABEL_BUMP="patch"
          fi

          if [ -n "$LABEL_BUMP" ]; then
            if [ "$LABEL_BUMP" = none ]; then
              echo "::notice::semver:none label — skipping release."
              { echo "type=none"; echo "release=false"; } >> "$GITHUB_OUTPUT"
            else
              if [ "$ALL_DEV" = true ]; then
                echo "::warning::PR #${N} carries semver:${LABEL_BUMP} but every changed file is dev-only; semver:none (or no label) would skip the release."
              fi
              { echo "type=${LABEL_BUMP}"; echo "release=true"; } >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          # 2/3. No label.
          if [ "$FILES_OK" != true ]; then
            if [ "$CLASSIFY_ERR" = true ]; then WHY="git check-ignore failed (rc=${rc})"; else WHY="could not list files (API failure or empty list)"; fi
            echo "::warning::No semver:* label and ${WHY} for PR #${N} — cannot classify, releasing as patch."
            { echo "type=patch"; echo "release=true"; } >> "$GITHUB_OUTPUT"
          elif [ "$ALL_DEV" = true ]; then
            COUNT=$(grep -c . <<<"$FILES" || true)
            echo "::notice::Dev-only rule: all ${COUNT} changed paths in PR #${N} are dev-only (first: $(grep . <<<"$FILES" | head -3 | paste -sd, -)) — skipping release."
            { echo "type=none"; echo "release=false"; } >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No semver:* label; ${FIRST_PRODUCT} is not dev-only — releasing as patch."
            { echo "type=patch"; echo "release=true"; } >> "$GITHUB_OUTPUT"
          fi

  prepare:
    name: Tag & Generate Notes
    needs: [detect]
    if: needs.detect.outputs.release == 'true'
    uses: jedwards1230/release-workflows/.github/workflows/ai-release.yml@9a48fc8ec1985081e7337e4ae6669a2753f847ef # v1
    with:
      service_name: anyctl
      service_description: "a manifest-driven CLI for HTTP/RPC service APIs"
      bump_type: ${{ needs.detect.outputs.bump_type }}
      create_release: false
      dry_run: ${{ needs.detect.outputs.dry_run == 'true' }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  build:
    name: Build static binaries
    needs: [detect, prepare]
    if: needs.detect.outputs.release == 'true' && needs.detect.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: true
      # setup-go exports GOTOOLCHAIN=local via $GITHUB_ENV; re-export auto (last
      # write wins) so the release binaries build with the go.mod `toolchain`
      # version (the patched crypto/tls stdlib).
      - name: Use go.mod toolchain (override setup-go GOTOOLCHAIN=local)
        run: echo "GOTOOLCHAIN=auto" >> "$GITHUB_ENV"
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          out="anyctl-${GOOS}-${GOARCH}"
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "$out" .
          sha256sum "$out" > "$out.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: anyctl-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            anyctl-${{ matrix.goos }}-${{ matrix.goarch }}
            anyctl-${{ matrix.goos }}-${{ matrix.goarch }}.sha256

  release:
    name: Create GitHub Release
    needs: [detect, prepare, build]
    if: needs.detect.outputs.release == 'true' && needs.detect.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Keyless cosign signing below mints a short-lived Fulcio cert from the
      # job's GitHub OIDC identity — needs id-token: write.
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate aggregate SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          # One checksum manifest over the release binaries only — exclude the
          # existing per-asset *.sha256 files (self-update reads those; their
          # format/naming is unchanged). SHA256SUMS is the signed artifact.
          find . -maxdepth 1 -type f -name 'anyctl-*' ! -name '*.sha256' -printf '%P\n' \
            | sort | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign SHA256SUMS (keyless, GitHub OIDC)
        working-directory: dist
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          # Keyless: identity from the job's GitHub OIDC token, cert from Fulcio,
          # transparency log entry in Rekor. Writes a single Sigstore bundle
          # (signature, Fulcio cert, Rekor entry) alongside SHA256SUMS; both ship in
          # the release. cosign v3 ignores --output-signature/--output-certificate,
          # so --bundle is required.
          cosign sign-blob \
            --bundle SHA256SUMS.sigstore.json \
            SHA256SUMS

      - name: Compose release body (install snippet + AI notes)
        env:
          BODY_B64: ${{ needs.prepare.outputs.release_body }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          echo "$BODY_B64" | base64 -d > /tmp/ai_body.md
          {
            echo "## Install"
            echo ""
            echo '```bash'
            echo "go install github.com/jedwards1230/anyctl@${VERSION}"
            echo '```'
            echo ""
            echo "Or download a static binary for your platform below."
            echo ""
            echo "## Verify"
            echo ""
            echo "\`SHA256SUMS\` lists every binary's digest; \`SHA256SUMS.sigstore.json\` is a keyless [cosign](https://docs.sigstore.dev/) signature over it. To verify:"
            echo ""
            echo '```bash'
            echo "sha256sum -c SHA256SUMS --ignore-missing   # checksums"
            echo "cosign verify-blob \\"
            echo "  --bundle SHA256SUMS.sigstore.json \\"
            echo "  --certificate-identity-regexp '^https://github.com/jedwards1230/anyctl/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
            echo "  SHA256SUMS"
            echo '```'
            echo ""
            echo "---"
            echo ""
          } > /tmp/release_body.md
          cat /tmp/ai_body.md >> /tmp/release_body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Release ${{ needs.prepare.outputs.version }}
          body_path: /tmp/release_body.md
          files: dist/*
          make_latest: true

      - name: Write summary
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          BUMP_TYPE: ${{ needs.detect.outputs.bump_type }}
        run: |
          {
            echo "## Release ${TAG}"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Version | ${VERSION} |"
            echo "| Bump | ${BUMP_TYPE} |"
          } >> "$GITHUB_STEP_SUMMARY"

  image:
    name: Build & push image
    needs: [detect, prepare]
    if: needs.detect.outputs.release == 'true' && needs.detect.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ghcr.io/jedwards1230/anyctl
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=latest
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    name: Package & push Helm chart
    needs: [detect, prepare]
    if: needs.detect.outputs.release == 'true' && needs.detect.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - name: Package & push chart
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package deploy/helm/anyctl-mcp --version "$VERSION" --app-version "$VERSION"
          helm push "anyctl-mcp-${VERSION}.tgz" oci://ghcr.io/jedwards1230/charts
